name: Windows toolchain + NTFS probe (R2.6 app gated)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Windows compiler independently
        shell: pwsh
        run: |
          dotnet --info
          dotnet run --project bootstrap/WindowsCompilerProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap compiler probe failed" }

      - name: Verify NTFS hardlinks and synthetic backup restoration
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsSafetyProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Synthetic NTFS probe failed" }

      - name: Validate and unpack the pinned R2.6 source kit
        if: hashFiles('Chappy_Storage_Compressor_R2_6_REDOWNLOAD.zip') != '' && hashFiles('ChappyStorageCompressor.csproj') == ''
        shell: pwsh
        run: |
          $archive = "Chappy_Storage_Compressor_R2_6_REDOWNLOAD.zip"
          $expected = "a2b3ed077deb0a5be856a57ab32e39ebfcd0b650c572e7923dc974b4d0fff5ec"
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "R2.6 SourceKit checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath "sourcekit"
          $project = "sourcekit/ChappyStorageCompressor_R2_6/ChappyStorageCompressor.csproj"
          if (-not (Test-Path $project)) { throw "Unexpected SourceKit layout" }
          # The archive smoke-test project links Core/*.cs but omits the app's
          # shared GlobalUsings.cs. Copy that source file into the isolated
          # test project so its IO types resolve without editing the pinned ZIP.
          $globals = "sourcekit/ChappyStorageCompressor_R2_6/GlobalUsings.cs"
          $testGlobals = "sourcekit/ChappyStorageCompressor_R2_6/tests/GlobalUsings.cs"
          if (-not (Test-Path $globals)) { throw "Missing application global usings" }
          Copy-Item -LiteralPath $globals -Destination $testGlobals
          # Apply the isolated test-only workaround to the extracted sources.
          & "$env:GITHUB_WORKSPACE/bootstrap/PatchR26SyntheticSentinel.ps1" -SourcePath "sourcekit/ChappyStorageCompressor_R2_6/Core/SyntheticReplacementExperiment.cs"
          Write-Host "Verified R2.6 SourceKit; app globals shared with synthetic tests"

      - name: Detect application sources
        id: source
        shell: pwsh
        run: |
          if (Test-Path "ChappyStorageCompressor.csproj") {
            "mode=tree" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "sourcekit/ChappyStorageCompressor_R2_6/ChappyStorageCompressor.csproj") {
            "mode=zip" >> $env:GITHUB_OUTPUT
          } else {
            "mode=bootstrap" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Bootstrap-only run. R2.6 application sources not yet uploaded."
            "R2.6 WPF application: NOT BUILT (source kit absent). Windows/NTFS bootstrap only." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Verify tracked R2.6 source contract and reference model
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          python tools/r26_contract_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/r26_reference_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build checked-in WPF source tree and isolated NTFS tests
        if: steps.source.outputs.mode == 'tree'
        shell: cmd
        run: call RUN_DIAGNOSTICS.bat

      - name: Verify R2.16 synthetic scanner benchmark and NTFS deep-check reduction
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r216-scanner-benchmark.json"
          if (-not (Test-Path $path)) { throw "R2.16 synthetic benchmark report missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.fileCount -ne 372 -or
              $r.repeatedSizeFiles -ne 12 -or
              $r.hashAttempts -gt 9 -or
              $r.verifiedDuplicateGroups -ne 3 -or
              $r.baselineDeepCaptures -lt 370 -or
              $r.pooledOperationCount -ne 24 -or
              $r.repeatedPooledOperationAllocatedBytes -ge 4000000 -or
              $r.buffersClearedOnReturn -ne $true -or
              $r.timingImprovementAsserted -ne $false -or
              $r.productionFileMutationEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.realMediaTouched -ne $false) {
            throw "R2.16 synthetic scanner evidence invalid or safety contract changed"
          }
          $ratio = 100.0 * (1 - $r.repeatedSizeFiles / $r.fileCount)
          "R2.16: synthetic expensive NTFS captures reduced by $([math]::Round($ratio, 1))% (NO timing speedup guarantee)"
          Get-Content $path

      - name: Verify R2.17 same-size benchmark and safety invariants
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-same-size-scanner.json"
          if (-not (Test-Path $path)) { throw "R2.17 generated scanner report missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.syntheticSourceBytes -lt 100MB -or
              $r.cacheStateControlled -ne $false -or
              $r.timingSpeedupAsserted -ne $false -or
              $r.processIoReadBytesArePhysicalDiskBytes -ne $false -or
              $r.peakWorkingSetIsPerScan -ne $false -or
              $r.guiInteractionVerified -ne $false -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.realMediaTouched -ne $false) {
            throw "R2.17 benchmark scope or production safety assertion changed"
          }
          $unique = @($r.samples | Where-Object { $_.dataset -eq "unique-heavy" })
          $same = @($r.samples | Where-Object { $_.dataset -eq "same-size-heavy" })
          if ($unique.Count -ne 2 -or $same.Count -ne 2) {
            throw "R2.17 must report initial/repeat runs on both datasets"
          }
          foreach ($s in $unique) {
            if ($s.fileCount -ne 48 -or $s.deepInspections -ne 0 -or
                $s.hashAttempts -ne 0 -or $s.verifiedGroups -ne 0) {
              throw "R2.17 unique-size optimization regression"
            }
          }
          foreach ($s in $same) {
            if ($s.fileCount -ne 76 -or $s.deepInspections -ne 76 -or
                $s.hashAttempts -ne 73 -or $s.verifiedGroups -ne 3) {
              throw "R2.17 same-size correctness or metadata gate regression"
            }
          }
          "R2.17: generated same-size safety checks passed; speedup NOT asserted"
          Get-Content $path

      - name: Verify R2.17 generated decodable PNG and JPEG batch profile
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-valid-image-profile.json"
          if (-not (Test-Path $path)) { throw "R2.17 valid image profile missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.generatedValidPngCount -ne 12 -or
              $r.generatedValidJpegCount -ne 12 -or
              $r.generatedInputBytes -le 0 -or
              $r.pngPreviewCandidateCount -le 0 -or
              $r.pngPreviewCandidateCount -ne $r.pngVerifiedDecodedCandidates -or
              $r.pngTheoreticalSavedBytes -le 0 -or
              $r.pngBatchFailureCount -ne 0 -or
              $r.jpegMarkerWicValidatedCount -ne 12 -or
              $r.jpegCandidateOptimizationMeasured -ne $false -or
              $r.jpegExternalExecutableInvoked -ne $false -or
              $r.jpegEngineMeasuredOnlyForPlanning -ne $true -or
              $r.progressUpdateCount -lt 12 -or
              $r.hardwareDiskReadsMeasured -ne $false -or
              $r.guiWorkflowVerified -ne $false -or
              $r.timingSpeedupClaimed -ne $false -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.originalMediaTouched -ne $false) {
            throw "R2.17 valid image evidence or source safety gate changed"
          }
          "R2.17 valid image PNG candidate and JPEG decoding benchmark evidence PASS"
          Get-Content $path

      - name: Verify R2.17 mid-file SHA byte progress and cancellation
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-hash-byte-progress.json"
          if (-not (Test-Path $path)) { throw "R2.17 hash progress evidence missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.syntheticFiles -ne 2 -or
              $r.bytesPerFile -ne 12582912 -or
              $r.checkedSha256MatchesFramework -ne $true -or
              $r.scannerVerifiedGroups -ne 1 -or
              $r.scannerHashAttempts -ne 2 -or
              $r.directHashProgressUpdates -lt 3 -or
              $r.scannerByteProgressUpdates -lt 8 -or
              $r.scannerIntermediateFileProgressObserved -ne $true -or
              $r.shaMidFileCancellationConfirmed -ne $true -or
              $r.scannerMidFileCancellationConfirmed -ne $true -or
              $r.allOriginalHashesPreserved -ne $true -or
              $r.actualWpfButtonClickedByGuiAutomation -ne $false -or
              $r.guiCompiledButInteractionUnverified -ne $true -or
              $r.automaticScanResumptionSupported -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.realMediaTouched -ne $false) {
            throw "R2.17 hash/cancel safety or evidence contract invalid"
          }
          "R2.17 typed SHA byte progress and mid-file cancellation tests PASS"
          Get-Content $path

      - name: Verify R2.17 combined preview resume preflight remains read-only
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-safe-preview-resume.json"
          if (-not (Test-Path $path)) { throw "R2.17 resume safety diagnostics missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.newEmptyOutputVerified -ne $true -or
              $r.pngOnlyResumeVerified -ne $true -or
              $r.combinedResumeVerified -ne $true -or
              $r.mismatchedInputRefused -ne $true -or
              $r.mismatchedJpegtranRefused -ne $true -or
              $r.unknownRootFileRefused -ne $true -or
              $r.unknownPreviewFileRefused -ne $true -or
              $r.jpegTornJournalRefused -ne $true -or
              $r.pngTornJournalRefused -ne $true -or
              $r.hardlinkedPlanRefused -ne $true -or
              $r.missingPlanWithJournalRefused -ne $true -or
              $r.allUserAndCandidateEvidencePreserved -ne $true -or
              $r.externalExecutableInvoked -ne $false -or
              $r.actualWpfClickAutomationVerified -ne $false -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.realMediaTouched -ne $false) {
            throw "R2.17 combined resume preflight evidence or safety contract invalid"
          }
          "R2.17 fail-closed combined preview resume inspection PASS"
          Get-Content $path

      - name: Measure NTFS allocated bytes and synthetic rollback
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsSpaceMeasurementProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "R2.8 synthetic NTFS measurement failed" }
          if (-not (Test-Path "diagnostics/r28-ntfs-space.json")) {
            throw "R2.8 structured measurement missing"
          }
          Get-Content "diagnostics/r28-ntfs-space.json"
          $report = Get-Content -Raw "diagnostics/r28-ntfs-space.json" | ConvertFrom-Json
          if ($report.productionMutationEnabled -ne $false) {
            throw "Production mutation must remain disabled"
          }
          if ($report.syntheticTestsPassed -ne $true -or
              $report.duplicates.uniqueFileIdAllocatedSavingsBytes -le 0 -or
              $report.duplicates.bothNamesShareNtfsIdentity -ne $true -or
              $report.png.faultAfterCommitRolledBackExactly -ne $true -or
              $null -ne $report.png.realWorldCapacityReclaimedBytes) {
            throw "R2.8 measurement or safety invariants failed"
          }

      - name: Force-kill disposable NTFS transaction subprocesses and verify exact replay
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsProcessKillRecoveryProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "R2.9 process-kill recovery tests failed" }
          if (-not (Test-Path "diagnostics/r29-process-crash.json")) {
            throw "R2.9 machine-readable test report missing"
          }
          $report = Get-Content -Raw "diagnostics/r29-process-crash.json" | ConvertFrom-Json
          if ($report.result -ne "PASS" -or $report.forcedKillCases -ne 9 -or
              $report.exactRestorations -ne 7 -or $report.failClosedRejections -ne 6 -or
              $report.productionMutationEnabled -ne $false -or
              $report.realMediaAffected -ne $false) {
            throw "R2.9 crash-recovery safety invariants failed"
          }
          Get-Content "diagnostics/r29-process-crash.json"

      - name: Detach synthetic hardlinked files and verify independent editing and crash replay
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsHardlinkDetachProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "R2.10 synthetic hardlink detach failed" }
          if (-not (Test-Path "diagnostics/r210-detach.json")) {
            throw "R2.10 structured detach report missing"
          }
          $report = Get-Content -Raw "diagnostics/r210-detach.json" | ConvertFrom-Json
          if ($report.verdict -ne "PASS" -or
              $report.forcedProcessTerminationCheckpoints -ne 4 -or
              $report.completeIndependentRestoreCases -ne 4 -or
              $report.independentEditingValidatedCases -ne 4 -or
              $report.unsafeMutationRefusals -ne 7 -or
              $report.productionHardlinkMutationEnabled -ne $false -or
              $report.productionOriginalReplacementEnabled -ne $false) {
            throw "R2.10 independent undo safety invariants failed"
          }
          Get-Content "diagnostics/r210-detach.json"

      - name: Refuse NTFS owner/DACL, ADS, identity and concurrent changes on synthetic files
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsMetadataGuardProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "R2.11 synthetic metadata guard failed" }
          if (-not (Test-Path "diagnostics/r211-ntfs-metadata.json")) {
            throw "R2.11 structured metadata report missing"
          }
          $report = Get-Content -Raw "diagnostics/r211-ntfs-metadata.json" | ConvertFrom-Json
          if ($report.result -ne "PASS" -or
              $report.baselineMetadataPasses -ne 7 -or
              $report.unsafeMetadataRefusals -ne 7 -or
              $report.descriptorMutationDetected -ne 2 -or
              $report.namedStreamMutationDetected -ne 1 -or
              $report.originalBytesPreservedInAllCases -ne $true -or
              $report.aclOwnerPreservationAfterCommitProved -ne $false -or
              $report.normalApplicationMutationsEnabled -ne $false -or
              $report.originalMediaUsed -ne $false) {
            throw "R2.11 metadata preflight invariants failed"
          }
          Get-Content "diagnostics/r211-ntfs-metadata.json"

      - name: Preserve synthetic NTFS owner DACL across replacement and exact rollback
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsSecurityPreservationProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "R2.12 security preservation experiment failed" }
          if (-not (Test-Path "diagnostics/r212-security-preservation.json")) {
            throw "R2.12 security preservation evidence missing"
          }
          $report = Get-Content -Raw "diagnostics/r212-security-preservation.json" | ConvertFrom-Json
          if ($report.verdict -ne "PASS" -or
              $report.customDaclReproducedInStage -ne $true -or
              $report.exactOwnerDaclAfterFileReplace -ne $true -or
              $report.exactOwnerDaclAfterRollback -ne $true -or
              $report.exactOriginalSha256AfterRollback -ne $true -or
              $report.negativePreflightRefusals -ne 5 -or
              $report.negativeDaclAlterationsDetected -ne 2 -or
              $report.negativeAdsChangesDetected -ne 1 -or
              $report.powerLossResilienceProven -ne $false -or
              $report.arbitraryAclAdsSaclPreservationProven -ne $false -or
              $report.productionMutationEnabled -ne $false -or
              $report.realUserMediaTouched -ne $false) {
            throw "R2.12 preservation evidence or fail-closed invariants not met"
          }
          Get-Content "diagnostics/r212-security-preservation.json"

      - name: Build unpacked R2.6 ZIP and isolated NTFS tests
        if: steps.source.outputs.mode == 'zip'
        shell: cmd
        working-directory: sourcekit/ChappyStorageCompressor_R2_6
        run: call RUN_DIAGNOSTICS.bat

      - name: Upload diagnostic logs
        if: always() && steps.source.outputs.mode != 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: chappy-windows-diagnostics
          path: |
            diagnostics/
            sourcekit/ChappyStorageCompressor_R2_6/diagnostics/
          if-no-files-found: warn

      - name: Upload compiled app
        if: success() && steps.source.outputs.mode != 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: chappy-win-x64-unverified
          path: |
            dist/win-x64/
            sourcekit/ChappyStorageCompressor_R2_6/dist/win-x64/
          if-no-files-found: error
