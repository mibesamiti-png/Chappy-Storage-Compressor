name: Windows toolchain + NTFS probe (R2.6 app gated)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Windows compiler independently
        shell: pwsh
        run: |
          dotnet --info
          dotnet run --project bootstrap/WindowsCompilerProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap compiler probe failed" }

      - name: Verify NTFS hardlinks and synthetic backup restoration
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsSafetyProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Synthetic NTFS probe failed" }

      - name: Validate and unpack the pinned R2.6 source kit
        if: hashFiles('Chappy_Storage_Compressor_R2_6_REDOWNLOAD.zip') != '' && hashFiles('ChappyStorageCompressor.csproj') == ''
        shell: pwsh
        run: |
          $archive = "Chappy_Storage_Compressor_R2_6_REDOWNLOAD.zip"
          $expected = "a2b3ed077deb0a5be856a57ab32e39ebfcd0b650c572e7923dc974b4d0fff5ec"
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "R2.6 SourceKit checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath "sourcekit"
          $project = "sourcekit/ChappyStorageCompressor_R2_6/ChappyStorageCompressor.csproj"
          if (-not (Test-Path $project)) { throw "Unexpected SourceKit layout" }
          # The archive smoke-test project links Core/*.cs but omits the app's
          # shared GlobalUsings.cs. Copy that source file into the isolated
          # test project so its IO types resolve without editing the pinned ZIP.
          $globals = "sourcekit/ChappyStorageCompressor_R2_6/GlobalUsings.cs"
          $testGlobals = "sourcekit/ChappyStorageCompressor_R2_6/tests/GlobalUsings.cs"
          if (-not (Test-Path $globals)) { throw "Missing application global usings" }
          Copy-Item -LiteralPath $globals -Destination $testGlobals
          # Apply the isolated test-only workaround to the extracted sources.
          & "$env:GITHUB_WORKSPACE/bootstrap/PatchR26SyntheticSentinel.ps1" -SourcePath "sourcekit/ChappyStorageCompressor_R2_6/Core/SyntheticReplacementExperiment.cs"
          Write-Host "Verified R2.6 SourceKit; app globals shared with synthetic tests"

      - name: Detect application sources
        id: source
        shell: pwsh
        run: |
          if (Test-Path "ChappyStorageCompressor.csproj") {
            "mode=tree" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "sourcekit/ChappyStorageCompressor_R2_6/ChappyStorageCompressor.csproj") {
            "mode=zip" >> $env:GITHUB_OUTPUT
          } else {
            "mode=bootstrap" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Bootstrap-only run. R2.6 application sources not yet uploaded."
            "R2.6 WPF application: NOT BUILT (source kit absent). Windows/NTFS bootstrap only." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Verify tracked R2.6 source contract and reference model
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          python tools/r26_contract_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/r26_reference_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build checked-in WPF source tree and isolated NTFS tests
        if: steps.source.outputs.mode == 'tree'
        shell: cmd
        run: call RUN_DIAGNOSTICS.bat

      - name: Measure NTFS allocated bytes and synthetic rollback
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsSpaceMeasurementProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "R2.8 synthetic NTFS measurement failed" }
          if (-not (Test-Path "diagnostics/r28-ntfs-space.json")) {
            throw "R2.8 structured measurement missing"
          }
          Get-Content "diagnostics/r28-ntfs-space.json"

      - name: Build unpacked R2.6 ZIP and isolated NTFS tests
        if: steps.source.outputs.mode == 'zip'
        shell: cmd
        working-directory: sourcekit/ChappyStorageCompressor_R2_6
        run: call RUN_DIAGNOSTICS.bat

      - name: Upload diagnostic logs
        if: always() && steps.source.outputs.mode != 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: chappy-windows-diagnostics
          path: |
            diagnostics/
            sourcekit/ChappyStorageCompressor_R2_6/diagnostics/
          if-no-files-found: warn

      - name: Upload compiled app
        if: success() && steps.source.outputs.mode != 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: chappy-win-x64-unverified
          path: |
            dist/win-x64/
            sourcekit/ChappyStorageCompressor_R2_6/dist/win-x64/
          if-no-files-found: error
