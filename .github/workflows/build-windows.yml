name: Windows toolchain + NTFS probe (R2.6 app gated)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Windows compiler independently
        shell: pwsh
        run: |
          dotnet --info
          dotnet run --project bootstrap/WindowsCompilerProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap compiler probe failed" }

      - name: Verify NTFS hardlinks and synthetic backup restoration
        shell: pwsh
        run: |
          dotnet run --project bootstrap/NtfsSafetyProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Synthetic NTFS probe failed" }

      - name: Validate and unpack the pinned R2.6 source kit
        if: hashFiles('Chappy_Storage_Compressor_R2_6_REDOWNLOAD.zip') != '' && hashFiles('ChappyStorageCompressor.csproj') == ''
        shell: pwsh
        run: |
          $archive = "Chappy_Storage_Compressor_R2_6_REDOWNLOAD.zip"
          $expected = "a2b3ed077deb0a5be856a57ab32e39ebfcd0b650c572e7923dc974b4d0fff5ec"
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "R2.6 SourceKit checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath "sourcekit"
          $project = "sourcekit/ChappyStorageCompressor_R2_6/ChappyStorageCompressor.csproj"
          if (-not (Test-Path $project)) { throw "Unexpected SourceKit layout" }
          # The archive smoke-test project links Core/*.cs but omits the app's
          # shared GlobalUsings.cs. Copy that source file into the isolated
          # test project so its IO types resolve without editing the pinned ZIP.
          $globals = "sourcekit/ChappyStorageCompressor_R2_6/GlobalUsings.cs"
          $testGlobals = "sourcekit/ChappyStorageCompressor_R2_6/tests/GlobalUsings.cs"
          if (-not (Test-Path $globals)) { throw "Missing application global usings" }
          Copy-Item -LiteralPath $globals -Destination $testGlobals
          # Apply the isolated test-only workaround to the extracted sources.
          & "$env:GITHUB_WORKSPACE/bootstrap/PatchR26SyntheticSentinel.ps1" -SourcePath "sourcekit/ChappyStorageCompressor_R2_6/Core/SyntheticReplacementExperiment.cs"
          Write-Host "Verified R2.6 SourceKit; app globals shared with synthetic tests"

      - name: Detect application sources
        id: source
        shell: pwsh
        run: |
          if (Test-Path "ChappyStorageCompressor.csproj") {
            "mode=tree" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "sourcekit/ChappyStorageCompressor_R2_6/ChappyStorageCompressor.csproj") {
            "mode=zip" >> $env:GITHUB_OUTPUT
          } else {
            "mode=bootstrap" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Bootstrap-only run. R2.6 application sources not yet uploaded."
            "R2.6 WPF application: NOT BUILT (source kit absent). Windows/NTFS bootstrap only." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Verify tracked R2.6 source contract and reference model
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          python tools/r26_contract_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/r26_reference_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preflight compile C# tests before external tool builds
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          # Only pre-build the Core test project. These two legacy test
          # projects share tests/obj and pre-building the UI runner second
          # can cause the Core runner to execute the wrong apphost.
          dotnet build tests/ChappyStorageCompressor.SmokeTests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Core safety test compilation failed" }

      - name: Build verified upstream libjpeg-turbo 3.2.1 jpegtran (CI synthetic test only)
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "3.2.1"
          $expected = "7b4993786d856cbccabfc0ed2f923ba000e326cc"
          $work = Join-Path $env:RUNNER_TEMP "chappy-r217-official-jpegtran"
          $source = Join-Path $work "libjpeg-turbo"
          $build = Join-Path $work "build"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          git clone --quiet --depth 1 --branch $tag https://github.com/libjpeg-turbo/libjpeg-turbo.git $source
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch official pinned upstream source" }
          $actual = (git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Official jpegtran source is not the pinned full Git commit"
          }
          # Build only the lossless jpegtran CLI with SIMD disabled.
          # Its timings are NOT production-optimized throughput.
          cmake -S $source -B $build -G "Visual Studio 18 2026" -A x64 -DWITH_SIMD=OFF -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_TURBOJPEG=OFF -DWITH_TESTS=OFF -DWITH_TOOLS=ON
          if ($LASTEXITCODE -ne 0) { throw "Pinned libjpeg-turbo CMake configure failed" }
          cmake --build $build --config Release --target jpegtran-static --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Pinned libjpeg-turbo jpegtran build failed" }
          $built = Join-Path $build "Release/jpegtran-static.exe"
          if (-not (Test-Path -LiteralPath $built)) {
            throw "Source-built jpegtran-static.exe missing"
          }
          # The production engine requires a jpegtran.exe basename.
          # Keep this CI-only test executable outside the repository.
          $tool = Join-Path $work "jpegtran.exe"
          Copy-Item -LiteralPath $built -Destination $tool -ErrorAction Stop
          "CHAPPY_R217_PINNED_JPEGTRAN=$tool" >> $env:GITHUB_ENV
          "CHAPPY_R217_JPEGTRAN_COMMIT=$expected" >> $env:GITHUB_ENV
          $digest = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Verified libjpeg-turbo $tag upstream commit $expected"
          Write-Host "CI-only jpegtran.exe built locally without SIMD; SHA256 $digest"
          & $tool -version
          if ($LASTEXITCODE -ne 0) { throw "Pinned jpegtran version check failed" }

      - name: Build official-source jpegtran with verified native x64 SIMD (synthetic CI only)
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "7b4993786d856cbccabfc0ed2f923ba000e326cc"
          $work = Join-Path $env:RUNNER_TEMP "chappy-r217-official-jpegtran"
          $source = Join-Path $work "libjpeg-turbo"
          $build = Join-Path $work "build-simd"
          $actual = (git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "SIMD build source is not exact verified upstream commit"
          }
          # NASM is a CI-only assembler, not an image optimizer/executable
          # distributed with Chappy. Chocolatey package 2.16.3 uses the official
          # NASM 2.16.03 x64 installer and an embedded SHA-256 checksum
          # 657E1252676CFB26A008835C20A760F731C8E0414469A4ED0F83F0FB059CDD35.
          # Refuse a different installed version.
          choco install nasm --version=2.16.3 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Pinned NASM assembler setup failed" }
          $nasm = @(
            "C:\Program Files\NASM\nasm.exe",
            "C:\Program Files (x86)\NASM\nasm.exe",
            "C:\ProgramData\chocolatey\bin\nasm.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nasm) {
            $cmd = Get-Command nasm -ErrorAction SilentlyContinue
            if ($cmd) { $nasm = $cmd.Source }
          }
          if (-not $nasm) { throw "Pinned NASM executable missing after setup" }
          $reported = (& $nasm -v) -join " "
          if ($LASTEXITCODE -ne 0 -or $reported -notmatch "2\.16\.03") {
            throw "Expected official NASM version 2.16.03, got $reported"
          }
          Write-Host "Pinned NASM assembler: $reported"
          cmake -S $source -B $build -G "Visual Studio 18 2026" -A x64 -DWITH_SIMD=ON -DREQUIRE_SIMD=ON -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_TURBOJPEG=OFF -DWITH_TESTS=OFF -DWITH_TOOLS=ON "-DCMAKE_ASM_NASM_COMPILER=$nasm"
          if ($LASTEXITCODE -ne 0) { throw "Official-source SIMD CMake configuration failed" }
          $cache = Get-Content -Raw (Join-Path $build "CMakeCache.txt")
          if ($cache -notmatch "(?m)^WITH_SIMD:BOOL=ON\r?$" -or
              $cache -notmatch "(?m)^REQUIRE_SIMD:(?:BOOL|UNINITIALIZED)=ON\r?$") {
            throw "Native SIMD is not enabled and required in the official build"
          }
          cmake --build $build --config Release --target jpegtran-static --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Pinned official-source SIMD build failed" }
          $built = Join-Path $build "Release/jpegtran-static.exe"
          if (-not (Test-Path -LiteralPath $built)) {
            throw "Native-SIMD source-built jpegtran executable missing"
          }
          $toolDir = Join-Path $work "simd"
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          $tool = Join-Path $toolDir "jpegtran.exe"
          Copy-Item -LiteralPath $built -Destination $tool -ErrorAction Stop
          $baseline = Join-Path $work "jpegtran.exe"
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash -eq
              (Get-FileHash $tool -Algorithm SHA256).Hash) {
            throw "SIMD and non-SIMD binary fingerprints unexpectedly identical"
          }
          & $tool -version
          if ($LASTEXITCODE -ne 0) { throw "SIMD jpegtran version check failed" }
          "CHAPPY_R217_SIMD_JPEGTRAN=$tool" >> $env:GITHUB_ENV
          "CHAPPY_R217_SIMD_VERIFIED=true" >> $env:GITHUB_ENV
          Write-Host "SIMD libjpeg-turbo pinned source $expected, binary SHA-256 $((Get-FileHash $tool -Algorithm SHA256).Hash)"

      - name: Build checked-in WPF source tree and isolated NTFS tests
        if: steps.source.outputs.mode == 'tree'
        shell: cmd
        run: call RUN_DIAGNOSTICS.bat

      - name: Require distinct Core and WPF test runners really executed
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $corePath = "diagnostics/smoke-tests.log"
          $uiPath = "diagnostics/wpf-routed-click.log"
          if (-not (Test-Path $corePath) -or -not (Test-Path $uiPath)) {
            throw "One or both distinct test runner logs missing"
          }
          $core = Get-Content -Raw $corePath
          $ui = Get-Content -Raw $uiPath
          if ($core -notmatch 'All [0-9]+ safety checks passed\.' -or
              $core -notmatch 'R2.17: actual Exif' -or
              $ui -notmatch 'R2.17 WPF ROUTED CLICK PASS' -or
              $core -match 'R2.17 WPF ROUTED CLICK PASS') {
            throw "Core/WPF runner output swapped or one safety suite skipped"
          }
          "Core and WPF independently ran their intended test entrypoints"

      - name: Verify R2.16 synthetic scanner benchmark and NTFS deep-check reduction
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r216-scanner-benchmark.json"
          if (-not (Test-Path $path)) { throw "R2.16 synthetic benchmark report missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.fileCount -ne 372 -or
              $r.repeatedSizeFiles -ne 12 -or
              $r.hashAttempts -gt 9 -or
              $r.verifiedDuplicateGroups -ne 3 -or
              $r.baselineDeepCaptures -lt 370 -or
              $r.pooledOperationCount -ne 24 -or
              $r.repeatedPooledOperationAllocatedBytes -ge 4000000 -or
              $r.buffersClearedOnReturn -ne $true -or
              $r.timingImprovementAsserted -ne $false -or
              $r.productionFileMutationEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.realMediaTouched -ne $false) {
            throw "R2.16 synthetic scanner evidence invalid or safety contract changed"
          }
          $ratio = 100.0 * (1 - $r.repeatedSizeFiles / $r.fileCount)
          "R2.16: synthetic expensive NTFS captures reduced by $([math]::Round($ratio, 1))% (NO timing speedup guarantee)"
          Get-Content $path

      - name: Verify R2.17 same-size benchmark and safety invariants
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-same-size-scanner.json"
          if (-not (Test-Path $path)) { throw "R2.17 generated scanner report missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.syntheticSourceBytes -lt 100MB -or
              $r.cacheStateControlled -ne $false -or
              $r.timingSpeedupAsserted -ne $false -or
              $r.processIoReadBytesArePhysicalDiskBytes -ne $false -or
              $r.peakWorkingSetIsPerScan -ne $false -or
              $r.guiInteractionVerified -ne $false -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.realMediaTouched -ne $false) {
            throw "R2.17 benchmark scope or production safety assertion changed"
          }
          $unique = @($r.samples | Where-Object { $_.dataset -eq "unique-heavy" })
          $same = @($r.samples | Where-Object { $_.dataset -eq "same-size-heavy" })
          if ($unique.Count -ne 2 -or $same.Count -ne 2) {
            throw "R2.17 must report initial/repeat runs on both datasets"
          }
          foreach ($s in $unique) {
            if ($s.fileCount -ne 48 -or $s.deepInspections -ne 0 -or
                $s.hashAttempts -ne 0 -or $s.verifiedGroups -ne 0) {
              throw "R2.17 unique-size optimization regression"
            }
          }
          foreach ($s in $same) {
            if ($s.fileCount -ne 76 -or $s.deepInspections -ne 76 -or
                $s.hashAttempts -ne 73 -or $s.verifiedGroups -ne 3) {
              throw "R2.17 same-size correctness or metadata gate regression"
            }
          }
          "R2.17: generated same-size safety checks passed; speedup NOT asserted"
          Get-Content $path

      - name: Verify R2.17 generated decodable PNG and JPEG batch profile
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-valid-image-profile.json"
          if (-not (Test-Path $path)) { throw "R2.17 valid image profile missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.generatedValidPngCount -ne 12 -or
              $r.generatedValidJpegCount -ne 12 -or
              $r.generatedInputBytes -le 0 -or
              $r.pngPreviewCandidateCount -le 0 -or
              $r.pngPreviewCandidateCount -ne $r.pngVerifiedDecodedCandidates -or
              $r.pngTheoreticalSavedBytes -le 0 -or
              $r.pngBatchFailureCount -ne 0 -or
              $r.jpegMarkerWicValidatedCount -ne 12 -or
              $r.jpegCandidateOptimizationMeasured -ne $false -or
              $r.jpegExternalExecutableInvoked -ne $false -or
              $r.jpegEngineMeasuredOnlyForPlanning -ne $true -or
              $r.progressUpdateCount -lt 12 -or
              $r.hardwareDiskReadsMeasured -ne $false -or
              $r.guiWorkflowVerified -ne $false -or
              $r.timingSpeedupClaimed -ne $false -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.originalMediaTouched -ne $false) {
            throw "R2.17 valid image evidence or source safety gate changed"
          }
          "R2.17 valid image PNG candidate and JPEG decoding benchmark evidence PASS"
          Get-Content $path

      - name: Verify R2.17 real source-pinned jpegtran candidates and unchanged originals
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-pinned-jpegtran-profile.json"
          if (-not (Test-Path $path)) { throw "R2.17 actual jpegtran evidence missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.upstreamVersion -ne "3.2.1" -or
              $r.upstreamCommit -ne "7b4993786d856cbccabfc0ed2f923ba000e326cc" -or
              $r.upstreamSourcePinnedAndCheckedByCi -ne $true -or
              $r.nativeSimdBuildEnabled -ne $false -or
              $r.officialBinaryInstallerUsed -ne $false -or
              $r.syntheticValidJpegCount -ne 8 -or
              $r.testJpegWithCommentMarkers -ne 4 -or
              $r.jpegtranActuallyExecuted -ne $true -or
              $r.jpegEngineActualCandidateGenerationMeasured -ne $true -or
              $r.generatedCandidateCount -le 0 -or
              $r.generatedCandidateCount -ne $r.verifiedDecodedCandidateCount -or
              $r.generatedCandidateCount -ne $r.verifiedProtectedMetadataCandidateCount -or
              $r.failureCount -ne 0 -or
              $r.theoreticalCandidateSavingBytes -le 0 -or
              $r.originalSourcesUnchanged -ne $true -or
              $r.resumeCreatedNoAdditionalCandidates -ne $true -or
              $r.candidateGenerationElapsedMs -le 0 -or
              $r.candidateResumeElapsedMs -le 0 -or
              $r.physicalDiskReadsControlled -ne $false -or
              $r.cleanColdWarmCacheControlled -ne $false -or
              $r.peakWorkingSetAttributedToJpegEngine -ne $false -or
              $r.physicalWpfMouseInteractionVerified -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.actualFreedBytes -ne 0 -or
              $r.realMediaTouched -ne $false) {
            throw "Actual pinned jpegtran profile or unchanged-source safety evidence invalid"
          }
          "R2.17 real official-source jpegtran candidate and pixel/metadata tests PASS"
          Get-Content $path

      - name: Verify R2.17 JPEG Exif XMP ICC and SIMD comparison (synthetic only)
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-jpeg-metadata-simd.json"
          if (-not (Test-Path $path)) { throw "R2.17 metadata SIMD evidence missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.version -ne "3.2.1" -or
              $r.officialCommit -ne "7b4993786d856cbccabfc0ed2f923ba000e326cc" -or
              $r.sourceCommitVerifiedInCi -ne $true -or
              $r.nasmVersion -ne "2.16.03" -or
              $r.twoDifferentLocallyBuiltToolHashes -ne $true -or
              $r.baselineSimdDisabled -ne $true -or
              $r.optimizedSimdRequiredInBuild -ne $true -or
              $r.generatedSyntheticJpegCount -ne 8 -or
              $r.hasSyntheticExifXmpIccApp13ComVariants -ne $true -or
              $r.appAndIndependentMarkerAuditsPassed -ne $true -or
              $r.independentAllPixelComparisonsPassed -ne $true -or
              $r.allSourcesSha256AndTimestampsPreserved -ne $true -or
              $r.testOrder -ne "baseline1-simd1-simd2-baseline2" -or
              @($r.performanceRuns).Count -ne 4 -or
              @($r.performanceRuns | Where-Object { $_.AcceptedCandidates -ne 8 -or $_.EstimatedSavingBytes -le 0 }).Count -ne 0 -or
              $r.baselineMedianWallMs -le 0 -or
              $r.simdMedianWallMs -le 0 -or
              $r.measuredSpeedupAsserted -ne $false -or
              $r.hostThermalsControlled -ne $false -or
              $r.coldCacheControlled -ne $false -or
              $r.physicalDiskReadsMeasured -ne $false -or
              $r.realPhotosTested -ne $false -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.realRecoveredBytes -ne 0) {
            throw "R2.17 metadata and SIMD evidence is incomplete or unsafe"
          }
          "R2.17 native SIMD and protected JPEG metadata PASS (no speed claim)"
          Get-Content $path

      - name: Verify R2.17 real Windows sRGB ICC and WPF color conversions
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-real-icc-color.json"
          if (-not (Test-Path $path)) { throw "R2.17 real ICC/WPF color evidence missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          if ($r.verdict -ne "PASS" -or
              $r.officialSourceCommit -ne "7b4993786d856cbccabfc0ed2f923ba000e326cc" -or
              $r.generatedOnly -ne $true -or
              $r.windowsInstalledColorProfileUsed -ne $true -or
              $r.actualProfileBytes -lt 132 -or
              $r.actualProfileBytes -gt 131072 -or
              $r.profileSha256 -notmatch "^[0-9A-F]{64}$" -or
              $r.profileIccHeaderAndTagCountValidated -ne $true -or
              $r.wpfColorContextOpenedOriginalProfile -ne $true -or
              $r.colorConvertedBitmapActuallyInvoked -ne $true -or
              $r.profileSplitIntoMultipleIccApp2Segments -ne $true -or
              $r.duplicateAndMissingApp2SegmentsRejected -ne $true -or
              $r.syntheticJpegCount -ne 4 -or
              $r.sourceHashesAndTimestampsUnchanged -ne $true -or
              $r.toolVariants -ne "baseline/simd" -or
              $r.runOrder -ne "baseline1-simd1-simd2-baseline2" -or
              @($r.runs).Count -ne 4 -or
              @($r.runs | Where-Object {
                $_.Accepted -ne 4 -or
                $_.SourceBytes -le $_.PreviewBytes -or
                $_.ProductionEngineMs -le 0 -or
                $_.IndependentAuditMs -le 0 -or
                $_.ManagedAllocatedBytesOnTestThread -lt 0 -or
                $_.ProcessWorkingSetBeforeBytes -le 0 -or
                $_.ProcessWorkingSetAfterBytes -le 0
              }).Count -ne 0 -or
              $r.productionEngineAndIndependentColorAuditMeasuredSeparately -ne $true -or
              $r.singleTestThreadAllocationSampleNotPeakMemory -ne $true -or
              $r.processWorkingSetSnapshotsNotAttributable -ne $true -or
              $r.coldAndWarmCacheNotControlled -ne $true -or
              $r.memoryPeakPerOperationMeasured -ne $false -or
              $r.measuredSimdSpeedupGuaranteed -ne $false -or
              $r.realPhotosTested -ne $false -or
              $r.actualRecoveredBytes -ne 0 -or
              $r.productionOriginalReplacementEnabled -ne $false -or
              $r.productionHardlinkMergeEnabled -ne $false -or
              $r.realMediaTouched -ne $false) {
            throw "Windows real ICC color-conversion evidence or safety gate failed"
          }
          "R2.17 real ICC profile, WIC color-management and candidate safety PASS"
          Get-Content $path

      - name: Verify R2.17 Exif rotation and sampled process working-set evidence
        if: steps.source.outputs.mode == 'tree'
        shell: pwsh
        run: |
          $path = "diagnostics/r217-exif-orientation-memory.json"
          if (-not (Test-Path $path)) { throw "Exif orientation and memory evidence missing" }
          $r = Get-Content -Raw $path | ConvertFrom-Json
          $b = $r.baseline
          $s = $r.simd
          if ($r.verdict -ne "PASS" -or
              $r.schema -ne "chappy-r217-exif-orientation-and-process-memory-v1" -or
              $r.sourceCommit -ne "7b4993786d856cbccabfc0ed2f923ba000e326cc" -or
              $r.syntheticJpegCount -ne 4 -or
              (@($r.exifOrientations) -join ',') -ne "1,3,6,8" -or
              $r.exifLittleEndianIfd0ActuallyParsed -ne $true -or
              $r.invalidAndChangedOrientationRejected -ne $true -or
              $r.allKeptCandidatesRawAndOrientedPixelsMatch -ne $true -or
              $r.allProtectedJpegMarkersMatch -ne $true -or
              $r.allOriginalHashesAndTimestampsUnchanged -ne $true -or
              $r.sourceBuiltNonSimdAndSimdCandidatesBothVerified -ne $true -or
              $b.Accepted -ne 4 -or
              $s.Accepted -ne 4 -or
              $b.EstimatedCandidateSavingBytes -le 0 -or
              $b.EstimatedCandidateSavingBytes -ne $s.EstimatedCandidateSavingBytes -or
              $b.EngineMs -le 0 -or $s.EngineMs -le 0 -or
              $b.AuditMs -le 0 -or $s.AuditMs -le 0 -or
              $b.WorkingSetSampledMaxBytes -le 0 -or
              $s.WorkingSetSampledMaxBytes -le 0 -or
              $b.WorkingSetSampleCount -le 0 -or
              $s.WorkingSetSampleCount -le 0 -or
              $b.ProcessLifetimePeakWorkingSetBytes -le 0 -or
              $s.ProcessLifetimePeakWorkingSetBytes -le 0 -or
